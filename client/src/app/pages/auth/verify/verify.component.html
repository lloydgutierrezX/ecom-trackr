<div class="flex flex-col gap-4 items-center justify-center min-h-screen text-screen">
    @if (isLoading) {
        <app-loader type="spinner"></app-loader>
    } @else if (isSuccess) {
        <app-icons name="success" class="text-green-500 w-16 h-16"></app-icons>
    } @else {
        <app-icons name="error" class="text-red-500 w-16 h-16"></app-icons>
    }

    <h3>Email Verification</h3>

    @if (message) {
        <p>{{ message }}</p>
    }
</div>
