<ng-template #signupLink>
    <p class="text-sm text-gray-500">
        Don't have an account?
        <a routerLink="/auth/register" class="text-blue-500">Register</a>
    </p>
</ng-template>

<ng-template #forgotPasswordLink>
    <p class="text-sm text-gray-500">
        <a routerLink="/auth/forgot-password" class="text-blue-500">Forgot Password?</a>
    </p>
</ng-template>

<div class="flex flex-col gap-4">
    <div class="w-full mx-auto">
        <app-dynamic-form [config]="signInFormConfig" [reset]="false" />
    </div>

    <div class="hidden justify-between sm:flex">
        <ng-container *ngTemplateOutlet="signupLink" />
        <ng-container *ngTemplateOutlet="forgotPasswordLink" />
    </div>

    <div class="flex justify-end">
        <button class="btn btn-md btn-primary w-full sm:w-32" (click)="onClick('login')">
            Login
        </button>
    </div>

    <div class="flex sm:hidden">
        <div class="flex w-full justify-center mx-2">
            <ng-container *ngTemplateOutlet="forgotPasswordLink" />
        </div>

        <div class="absolute w-full bottom-0 left-0 mb-8 text-center">
            <ng-container *ngTemplateOutlet="signupLink" />
        </div>
    </div>
</div>
