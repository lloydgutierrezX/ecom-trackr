<label class="input input-bordered flex items-center gap-2">
    <app-icons [name]="'mail'" class="w-5 h-5" />
    <input
        type="email"
        [formControl]="formControl"
        [name]="config.field.name"
        [class]="
            'input text-sm focus:outline-none border-gray-400' +
            ' ' +
            (config.container?.className ?? '')
        "
        [attr.style]="config.container?.cssStyle"
        [placeholder]="config.field.placeholder ?? ''"
        [autocomplete]="config.field.autoComplete || 'off'"
    />
</label>
