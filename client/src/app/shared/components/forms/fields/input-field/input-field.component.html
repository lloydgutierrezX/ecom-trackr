<label
    class="input text-sm focus-within:outline-none focus-within:ring-0 border-gray-400 flex justify-center items-center gap-2"
>
    @if (config.icon) {
        <app-icons [name]="config.icon" />
    }

    <input
        #inputField
        [formControl]="formControl"
        [name]="config.field.name"
        [class]="
            'input text-sm focus:outline-none border-none bg-gray-100 px-0' +
            ' ' +
            (config.container?.className ?? '')
        "
        [type]="type"
        [attr.style]="config.container?.cssStyle"
        [placeholder]="config.field.placeholder ?? ''"
        [readOnly]="config.field.readonly || false"
        [autocomplete]="config.field.autoComplete || 'off'"
    />

    @if (config.type === 'password') {
        <button type="button" (click)="togglePassword()" class="text-gray-500 hover:text-gray-700">
            <app-icons [name]="passwordIcon" class="w-5 h-5" />
        </button>
    }
</label>
