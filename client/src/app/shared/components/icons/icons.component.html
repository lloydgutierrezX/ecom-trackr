@switch (name) {
    @case ('circle-gauge') {
        <lucide-icon [img]="CircleGauge" aria-label="Icon" />
    }

    @case ('hand-coins') {
        <lucide-icon [img]="HandCoins" aria-label="Icon" />
    }

    @case ('banknote-arrow-down') {
        <lucide-icon [img]="BanknoteArrowDown" aria-label="Icon" />
    }

    @case ('settings') {
        <lucide-icon [img]="Settings" aria-label="Icon" />
    }

    @case ('blocks') {
        <lucide-icon [img]="Blocks" aria-label="Icon" />
    }

    @case ('user-cog') {
        <lucide-icon [img]="UserCog" aria-label="Icon" />
    }

    @case ('box') {
        <lucide-icon [img]="Box" aria-label="Icon" />
    }

    @case ('user-round') {
        <lucide-icon [img]="UserRound" aria-label="Icon" />
    }

    @case ('logout') {
        <lucide-icon [img]="Logout" aria-label="Logout icon" />
    }
}
