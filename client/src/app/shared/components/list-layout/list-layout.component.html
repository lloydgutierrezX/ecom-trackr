<div class="relative space-y-4">
    <div class="flex justify-between items-center">
        <h2 class="text-xl font-semibold text-base-content">
            {{ title }}
        </h2>
    </div>

    <div class="flex flex-col md:flex-row md:items-center md:justity-between gap-4 mb-4">
        <div
            class="flex flex-col flex-grow border-md sm:flex-row items-stretch gap-2 w-full md:w-auto"
        >
            <!-- search input -->
            <ng-content select="[search]" />

            <!-- filters -->
            <ng-content select="[filters]" />
        </div>

        <div class="flex justify-end">
            <!-- add button -->
            <ng-content select="[add-button]" />
        </div>
    </div>
    <!-- table -->
    <ng-content select="[table]" />

    <!-- pagination -->
    <ng-content select="[pagination]" />
</div>
