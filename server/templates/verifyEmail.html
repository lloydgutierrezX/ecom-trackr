<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Verify Your Email</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
  <table width="100%" cellspacing="0" cellpadding="0">
    <tr>
      <td align="center">
        <table width="600" cellpadding="20" cellspacing="0" style="background: #fff; border-radius: 8px;">
          <tr>
            <td>
              <h2 style="color:#333;">Welcome to Ecom-Trackr!</h2>
              <p>Thanks for signing up. Please confirm your email address by clicking the button below:</p>
              <p style="text-align: center;">
                <a href="{{verificationLink}}" style="display:inline-block; padding:12px 20px; background:#007BFF; color:#fff; border-radius:6px; text-decoration:none;">Verify My Email</a>
              </p>
              <p>If the button doesn’t work, copy and paste this link into your browser:</p>
              <p style="word-break: break-all;">{{verificationLink}}</p>
              <p style="color:#777; font-size: 12px;">If you did not sign up, you can safely ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
